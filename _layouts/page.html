---
layout: default
---
<div class="wrap page-head">
  <h1>{{ page.title }}</h1>
  {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
</div>

<div class="wrap doc-grid">
  <aside class="toc" aria-label="On this page">
    <p class="toc-title">On this page</p>
    <ol id="toc-list"></ol>
  </aside>
  <article class="prose" id="prose">
    {{ content }}
  </article>
</div>

<script>
(function () {
  var prose = document.getElementById('prose');
  var list = document.getElementById('toc-list');
  if (!prose || !list) return;
  var heads = prose.querySelectorAll('h2');
  if (!heads.length) return;
  Array.prototype.forEach.call(heads, function (h) {
    if (!h.id) {
      h.id = h.textContent.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');
    }
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace(/^\d+\.\s*/, '');
    li.appendChild(a);
    list.appendChild(li);
  });
  document.querySelector('.toc').classList.add('is-ready');
})();
</script>
