<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌙</text></svg>">
</head>
<body class="{{ page.body_class }}">

<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Cathode</span>
      <span class="brand-ver">v{{ site.theme_version }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/docs/' | relative_url }}"{% if page.url == '/docs/' %} aria-current="page"{% endif %}>Documentation</a>
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
    </nav>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer class="site-foot">
  <div class="wrap foot-inner">
    <p>Cathode {{ site.theme_version }} — a Shopify theme.</p>
    <p class="foot-links">
      <a href="{{ '/docs/' | relative_url }}">Documentation</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
    </p>
  </div>
</footer>

</body>
</html>
