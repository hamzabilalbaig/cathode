# Nocturne — documentation and support site
# Served by GitHub Pages at https://hamzabilalbaig.github.io/nocturne/

title: Nocturne
tagline: A dark, neon-lit Shopify theme for footwear.
description: Documentation and support for the Nocturne Shopify theme.

# If you rename this repository, change baseurl to match, or every link breaks.
# url + baseurl are what make absolute_url work for the form's _next redirect.
url: "https://hamzabilalbaig.github.io"
baseurl: "/nocturne"

theme_version: "1.0.0"
response_time: "two business days"

# ---------------------------------------------------------------------------
# SETUP REQUIRED — the support form does nothing until this is set.
#
# The form posts to FormSubmit (https://formsubmit.co). Free, no signup.
#   1. Put your support email here temporarily, e.g. support@example.com
#   2. Push, open /support/, and submit one test message.
#   3. FormSubmit emails you a confirmation link and a masked token
#      (looks like "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"). Click the link.
#   4. Replace the email below with that masked token, so your address is
#      not sitting in the page HTML for scrapers.
#
# Leave _captcha enabled in support.html: FormSubmit's auto-responder does
# not fire when the captcha is turned off, and the Theme Store requires an
# auto-responder.
# ---------------------------------------------------------------------------
formsubmit_id: "REPLACE_ME"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
